[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nianxia-core"
version = "0.1.0"
description = "念匣 companion-core：本地陪伴运行时（人设/记忆/领悟/氛围/推理路由）"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "httpx>=0.28",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "platformdirs>=4.3",
  "filelock>=3.16",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/nianxia_core"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
